<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Ventana 3/CSS/index.css">
</head>
<body>
    <header>
        <div class="barra-busqueda">
            <img src="./Ventana 3/IMAGENES/Log.png"  class="logo-busqueda" alt="logo">
            <div class="grupo-busqueda">
                <input type="text" placeholder="Escribe tu destino..." class="input-destino">
                <button class="btn-buscar">Buscar</button>
            </div>
        </div>
    </header>
    <section>
        <div class="contenedor">
            <div class="p"><button>precios</button></div>
            <div class="c"><button>categoria</button></div>
            <div class="u"><button>ubicacion</button></div>
            <div class="t"><button>general</button></div>
            <div class="seccion-imagenes">
            <div class="tarjeta">
                <img src="/Ventana 3/IMAGENES/pantalon.jpg" alt="Producto">
                <div class="descripcion">
                    <p><strong>Precio:</strong> $50.000</p>
                    <p><strong>Categoría:</strong> pantalon</p>
                    <p><strong>Ubicación:</strong> bogota</p>
                </div>
            </div>
            <div class="tarjeta">
                <img src="./Ventana 3/IMAGENES/sudadera.jpg" alt="Producto">
                <div class="descripcion">
                    <p><strong>Precio:</strong> $30.000</p>
                    <p><strong>Categoría:</strong> sudadera</p>
                    <p><strong>Ubicación:</strong> bogota</p>
                </div>
            </div>
            <div class="tarjeta">
                <img src="./Ventana 3/IMAGENES/camiseta.jpeg" alt="producto">
                <div class="descripcion">
                    <p><strong>precio</strong>$15.000</p>
                    <p><strong>categoria</strong>camiseta</p>
                    <p><strong>ubicacion</strong>medellin</p>
                </div>
            </div>
            <div class="tarjeta">
                <img src="./Ventana 3/IMAGENES/buso.webp" alt="producto">
                <div class="descripcion">
                    <p><strong>precio</strong>$80.000</p>
                    <p><strong>categoria</strong>buso</p>
                    <p><strong>ubicacion</strong>medellin</p>
                </div>
            </div>
            <div class="tarjeta">
                <img src="" alt="">
                <div class="descripcion">
                    <p><strong>precio</strong></p>
                    <p><strong>categoria</strong></p>
                    <p><strong>ubicacion</strong></p>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
