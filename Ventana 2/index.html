<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/Ventana 2/CSS/index.css">
    <link rel="shortcut icon" href="/Ventana 1/Images/Log.ico" type="image/x-icon">
</head>
<body>
    <div class="contenedor-volver">
        <a href="/Ventana 1/index.html" class="boton-volver">← Volver al Inicio</a>
    </div>
    <header class="encabezado">
        <h1>SUPPORTING D-MARKS</h1>
        <p>ZONA DE REGISTRO</p>
    </header>
    <div class="contenedor-principal">
        
        <section class="tarjeta compradores">
            <h2>COMPRADORES</h2>
            <p>Encuentra las mejores marcas de ropa</p>
            
            <form>
                <label>Nombre de usuario:</label>
                <input type="text" placeholder="@usuario" required>

                <label>Nombre:</label>
                <input type="text" placeholder="Tu nombre" required>

                <label>Apellido:</label>
                <input type="text" placeholder="Tu apellido" required>

                <label>Contraseña:</label>
                <input type="password" placeholder="Crea una contraseña" required>

                <button type="submit" class="boton-enviar">Registrarme</button>
            </form>

            <p class="texto-o">o ingresar con:</p>
            <div class="botones-redes">
                <button type="button" class="boton-social google">Google</button>
                <button type="button" class="boton-social apple">Apple</button>
            </div>
        </section>
        <section class="tarjeta marcas">
            <h2>CREADORES & MARCAS</h2>
            <p>Promociona tu marca emergente aquí</p>
            
            <form>
                <label>Nombre del creador:</label>
                <input type="text" placeholder="Tu nombre completo" required>

                <label>Nombre de la marca:</label>
                <input type="text" placeholder="Nombre de tu marca" required>

                <label>Contacto (Email o Teléfono):</label>
                <input type="text" placeholder="Correo o celular" required>

                <label>Contraseña:</label>
                <input type="password" placeholder="Crea una contraseña" required>

                <button type="submit" class="boton-enviar">Registrar Marca</button>
            </form>

            <p class="texto-o">o registrar marca con:</p>
            <div class="botones-redes">
                <button type="button" class="boton-social google">Google</button>
                <button type="button" class="boton-social apple">Apple</button>
            </div>
        </section>

    </div>

</body>
</html>
